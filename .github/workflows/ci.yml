name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (Android + Shared)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check if Gradle wrapper exists
        id: check_gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "has_gradlew=true" >> "$GITHUB_OUTPUT"
          else
            echo "gradlew not found, skipping build until Gradle wrapper is configured"
            echo "has_gradlew=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build shared module
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        run: ./gradlew :shared:assemble

      - name: Run shared tests
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        run: ./gradlew :shared:allTests

      - name: Build Android app
        if: steps.check_gradle.outputs.has_gradlew == 'true'
        run: ./gradlew :composeApp:assembleDebug
